<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Compact Powder - Ivory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <polygon points="0,0 600,0 600,300 0,120" fill="url(#sheen)"/>
  <rect width="600" height="600" fill="url(#glow)"/>

  <!-- floating bubbles -->
  <circle cx="70" cy="470" r="90" fill="#ffffff" opacity="0.10"/>
  <circle cx="540" cy="430" r="70" fill="#ffffff" opacity="0.12"/>
  <circle cx="120" cy="120" r="46" fill="#ffffff" opacity="0.14"/>
  <circle cx="470" cy="180" r="26" fill="#ffffff" opacity="0.18"/>
  <circle cx="240" cy="60" r="18" fill="#ffffff" opacity="0.20"/>
  <circle cx="60" cy="300" r="14" fill="#ffffff" opacity="0.22"/>

  <!-- sparkles -->
  <path d="M 520 284 Q 522.88 297.12 536 300 Q 522.88 302.88 520 316 Q 517.12 302.88 504 300 Q 517.12 297.12 520 284 Z" fill="#ffffff" opacity="0.75"/>
  <path d="M 90 198 Q 92.16 207.84 102 210 Q 92.16 212.16 90 222 Q 87.84 212.16 78 210 Q 87.84 207.84 90 198 Z" fill="#ffffff" opacity="0.65"/>
  <path d="M 430 60 Q 431.8 68.2 440 70 Q 431.8 71.8 430 80 Q 428.2 71.8 420 70 Q 428.2 68.2 430 60 Z" fill="#ffffff" opacity="0.7"/>
  <path d="M 170 421 Q 171.62 428.38 179 430 Q 171.62 431.62 170 439 Q 168.38 431.62 161 430 Q 168.38 428.38 170 421 Z" fill="#ffffff" opacity="0.6"/>

  <!-- category pill -->
  <g>
    <rect x="34" y="36" width="122" height="44" rx="22" fill="#ffffff" opacity="0.22"/>
    <text x="95" y="65" font-size="21" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">MAKEUP</text>
  </g>

  
  <g transform="rotate(8 505 92)">
    <circle cx="505" cy="92" r="56" fill="#ffffff" opacity="0.96"/>
    <circle cx="505" cy="92" r="56" fill="none" stroke="#db2777" stroke-width="4" stroke-dasharray="6 7"/>
    <text x="505" y="88" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="800" fill="#db2777" text-anchor="middle">22%</text>
    <text x="505" y="118" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#db2777" text-anchor="middle" letter-spacing="3">OFF</text>
  </g>

  <!-- product plate -->
  <ellipse cx="300" cy="425" rx="150" ry="26" fill="#000000" opacity="0.16"/>
  <circle cx="300" cy="272" r="142" fill="#ffffff" opacity="0.97" filter="url(#soft)"/>
  <circle cx="300" cy="272" r="142" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="300" cy="272" r="126" fill="none" stroke="#fda4af" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="4 10"/>
  <text x="300" y="332" font-size="150" text-anchor="middle">💅</text>

  

  <!-- product name -->
  <text x="300" y="498" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">Compact Pow</text><text x="300" y="538" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">der - Ivory</text>

  <!-- wordmark -->
  <text x="300" y="574" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff" fill-opacity="0.8" text-anchor="middle" letter-spacing="7">JAYAMART</text>
</svg>